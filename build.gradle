plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group 'com.example'
version '1.0'

repositories {
    mavenCentral()
    maven {
        url 'https://files.minecraftforge.net/maven'
    }
}

dependencies {
    implementation fg.deobf('net.minecraftforge:forge:1.19.2-43.1.0')
    implementation fg.deobf('net.minecraft:client:1.19.2')
    implementation fg.deobf('net.minecraft:server:1.19.2')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.19.2'
}
